<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./src/file_000000007eac820ea5685ab4a9be1658.png" type="image/x-icon">
    <title>Placar BJJ</title>
</head>

<body>
    <header>
        <img src="./src/file_000000007eac820ea5685ab4a9be1658.png" alt="Logo do Placar" class="logo">
        <p>Academia De Jiu-Jitsu Sergio Corrêa</p>

        <input type="text" id="definir-tempo" placeholder="00:00">

    </header>

    <main>
        <section class="contagem-tempo">
            <div class="tempo-luta">
                <time id="temporizador">00:00 min</time>

                <div class="button">
                    <button id="iniciar" onclick="iniciarCronometro()">Iniciar</button>
                    <button id="reset" onclick="resetTempo()">Resetar Tempo</button>
                </div>
            </div>
        </section>

        <section class="atletas">
            <div class="atleta01">
                <input type="text" id="atleta01" placeholder="Atleta 01">
                <div class="cor-faixa"></div>
                <div class="pontuacao">
                    <p><span id="contador-placar-at01">0</span> pts</p>
                    <div class="btn-pontos">
                        <button id="add-ponto-at01-02" onclick="contarPontuaçãoMais02()">+2</button>
                        <button id="add-ponto-at01-03" onclick="contarPontuaçãoMais03()">+3</button>
                        <button id="add-ponto-at01-04" onclick="contarPontuaçãoMais04()">+4</button>
                        <button id="remover-ultimo-ponto-at01" onclick="removerUltimoPontoAt01()">Remover Ponto</button>
                    </div>
                </div>

                <div class="bloco-vantagem-falta">
                    <div class="vantagem">
                        <p class="titulo-vantagem">Vantagem</p>
                        <span id="contador-vantagem-at01">0</span>
                        <div class="vantagem-buttons">
                            <button class="add-vantagem" id="add-vantagem-at01" onclick="addvantagem()">+</button>
                            <button class="remove-vantagem" id="remove-vantagem-at01"
                                onclick="removevantagem()">-</button>
                        </div>
                    </div>


                    <div class="faltas">
                        <p class="titulo-faltas">Faltas</p>
                        <span id="contador-faltas-at01">0</span>
                        <div class="faltas-buttons">
                            <button class="add-faltas" id="add-faltas-at01" onclick="addfaltas()">+</button>
                            <button class="remove-faltas" id="remove-faltas-at01" onclick="removefaltas()">-</button>
                        </div>
                    </div>
                </div>
            </div>

            <h1>VS</h1>

            <div class="atleta02">
                <input type="text" id="atleta02" placeholder="Atleta 02">
                <div class="pontuacao">
                    <p><span id="contador-placar-at02">0</span> pts</p>
                    <div class="btn-pontos">
                        <button id="add-ponto-at02-02" onclick="contarPontuaçãoMais02At02()">+2</button>
                        <button id="add-ponto-at02-03" onclick="contarPontuaçãoMais03At02()">+3</button>
                        <button id="add-ponto-at02-04" onclick="contarPontuaçãoMais04At02()">+4</button>
                        <button id="remover-ultimo-ponto-at02" onclick="removerUltimoPontoAt02()">Remover
                            Ponto</button>
                    </div>
                </div>


                <div class="bloco-vantagem-falta">
                    <div class="vantagem">
                        <p class="titulo-vantagem">Vantagem</p>
                        <span id="contador-vantagem-at02">0</span>
                        <div class="vantagem-buttons">
                            <button class="add-vantagem" id="add-vantagem-at02" onclick="addvantagemAt02()">+</button>
                            <button class="remove-vantagem" id="remove-vantagem-at02"
                                onclick="removevantagemAt02()">-</button>
                        </div>
                    </div>

                    <div class="faltas">
                        <p class="titulo-faltas">Faltas</p>
                        <span id="contador-faltas-at02">0</span>
                        <div class="faltas-buttons">
                            <button class="add-faltas" id="add-faltas-at02" onclick="addfaltasAt02()">+</button>
                            <button class="remove-faltas" id="remove-faltas-at02"
                                onclick="removefaltasAt02()">-</button>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
